name: Seed Workshop

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: seed-workshop

jobs:
  seed:
    if: ${{ !github.event.repository.is_template && github.repository != 'EmileVerbunt/AgenticWorkflows' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create workshop issues and sample pull request
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;

            const labels = [
              ["workshop", "Workshop guidance and generated artifacts", "1f6feb"],
              ["assignment", "Participant workflow assignment", "8250df"],
              ["beginner", "Introductory workshop assignment", "2da44e"],
              ["advanced", "Advanced workshop assignment", "bf8700"],
              ["sample-pr", "Pull request created for a workshop exercise", "0969da"],
              ["automation", "Created or used by repository automation", "57606a"],
              ["code-quality", "Code quality analysis and improvements", "0e8a16"],
              ["documentation", "Documentation improvements", "0075ca"],
              ["testing", "Test quality and coverage", "d4c5f9"]
            ];

            for (const [name, description, color] of labels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
                await github.rest.issues.updateLabel({ owner, repo, name, description, color });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, description, color });
              }
            }

            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100
            });

            async function ensureIssue(title, file, issueLabels) {
              const body = fs.readFileSync(file, "utf8");
              const marker = body.match(/<!-- ([^>]+) -->/)?.[0];
              const existing = allIssues.find(item =>
                !item.pull_request &&
                marker &&
                item.body?.includes(marker)
              );

              if (!existing) {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels: issueLabels
                });
              }
            }

            await ensureIssue(
              "Start here: Build your first agentic workflow",
              ".github/workshop/start-here.md",
              ["workshop"]
            );
            await ensureIssue(
              "Assignment: Build an observability gap finder",
              ".github/workshop/assignments/observability-gap-finder.md",
              ["workshop", "assignment", "beginner"]
            );
            await ensureIssue(
              "Assignment: Build an API error contract reviewer",
              ".github/workshop/assignments/api-error-contract-reviewer.md",
              ["workshop", "assignment", "beginner"]
            );
            await ensureIssue(
              "Assignment: Build a pull request test-plan reviewer",
              ".github/workshop/assignments/pull-request-test-plan-reviewer.md",
              ["workshop", "assignment", "advanced"]
            );
            await ensureIssue(
              "Assignment: Build an API reference generator",
              ".github/workshop/assignments/api-reference-generator.md",
              ["workshop", "assignment", "advanced"]
            );

            const branch = "workshop/sample-api-change";
            const existingPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              head: `${owner}:${branch}`,
              per_page: 100
            });

            let samplePull = existingPulls[0];

            if (!samplePull) {
              const base = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${defaultBranch}`
              });

              try {
                await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
                await github.rest.git.updateRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`,
                  sha: base.data.object.sha,
                  force: true
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/heads/${branch}`,
                  sha: base.data.object.sha
                });
              }

              const statusPath = "src/AgenticWorkflows.Api/Models/WorkItemStatus.cs";
              const statusResponse = await github.rest.repos.getContent({
                owner,
                repo,
                path: statusPath,
                ref: defaultBranch
              });
              const baseStatus = Buffer.from(
                statusResponse.data.content,
                "base64"
              ).toString("utf8");
              const statusCandidates = ["Blocked", "WaitingForReview", "Escalated"];
              const sampleStatus = statusCandidates.find(
                candidate => !baseStatus.includes(`    ${candidate},`)
              ) || `WorkshopReview${context.runNumber}`;

              async function updateFile(path, transform, message) {
                const response = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path,
                  ref: branch
                });
                const current = Buffer.from(
                  response.data.content,
                  "base64"
                ).toString("utf8");
                const updated = transform(current);

                if (updated === current) {
                  throw new Error(`Sample change target was not found in ${path}`);
                }

                await github.rest.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path,
                  branch,
                  message,
                  sha: response.data.sha,
                  content: Buffer.from(updated).toString("base64")
                });
              }

              await updateFile(
                statusPath,
                content => content.replace(
                  /    Done/,
                  `    ${sampleStatus},\n    Done`
                ),
                `Add ${sampleStatus} work-item status`
              );
              await updateFile(
                "tests/AgenticWorkflows.Api.Tests/WeakCoverageTests.cs",
                content => content.replace(
                  /Assert\.Equal\((\d+), Enum\.GetValues<WorkItemStatus>\(\)\.Length\);/,
                  (_, count) =>
                    `Assert.Equal(${Number(count) + 1}, Enum.GetValues<WorkItemStatus>().Length);`
                ),
                "Update work-item status count"
              );

              const created = await github.rest.pulls.create({
                owner,
                repo,
                head: branch,
                base: defaultBranch,
                title: `Workshop sample: add ${sampleStatus} work-item status`,
                body: [
                  "<!-- workshop:sample-pr -->",
                  "## Summary",
                  "",
                  `Adds a ${sampleStatus} status for work items and updates the existing status-count test.`,
                  "",
                  "This pull request is intentionally incomplete. Use it as the target for the advanced pull-request reviewer assignment."
                ].join("\n")
              });
              samplePull = created.data;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: samplePull.number,
              labels: ["workshop", "sample-pr"]
            });
