name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore AgenticWorkflows.slnx

      - name: Build
        run: dotnet build AgenticWorkflows.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AgenticWorkflows.slnx --configuration Release --no-build
